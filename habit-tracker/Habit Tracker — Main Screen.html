<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker — Main Screen (Swiss Editorial)</title>
<!--
  System: Swiss Editorial (Pentagram / Vignelli lineage)
  Type: Archivo — one grotesque family, weights 400/500/600/700 · 11 (micro-label) / 14 (body) / 19 (row) / 30 (section) / 52 (streak numeral)
  Color: ink #1A1A1A on paper #F6F5F0 · hairline rules #D9D7CF · muted #6B6B6B · accent #E63329 (signal only — checks, streak, dot)
  Grid: hairline rules, left-flush headlines, oversized folio numerals, numbered sections (01/02/03), uppercase micro-labels, tabular numerals
  Signature moves: giant streak numeral, hairline separators, single accent, generous negative space
  Platform: iOS (393×852) + Android (412×915), both rendered side-by-side sharing one state
  Fidelity: hi-fi interactive prototype (React 18 + Babel, pinned). Real state: habit toggling, add form, nav, Tweaks.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Archivo", "Helvetica Neue", sans-serif; background: #ECE9E2; color: #1A1A1A; }

  .page { max-width: 1180px; margin: 0 auto; padding: 28px 28px 60px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid #1A1A1A; padding-bottom: 14px; }
  .toolbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  .toolbar .sys { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #6B6B6B; }
  .toolbar .note { width: 100%; font-size: 12px; line-height: 1.5; color: #6B6B6B; }
  .toolbar code { background: #DFDAD0; border-radius: 3px; padding: 1px 5px; font-size: 11px; }

  .devices { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; margin-top: 34px; }
  .device-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .device-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B6B; }

  /* device frames */
  .frame-wrap { position: relative; }
  .frame-scaled { transform-origin: top left; }
  .ios-wrap { width: 236px; height: 511px; }
  .ios-scaled { transform: scale(0.6); }
  .android-wrap { width: 227px; height: 503px; }
  .android-scaled { transform: scale(0.55); }
  .ios-frame { width: 393px; height: 852px; background: #000; border-radius: 56px; padding: 14px; box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 30px 60px rgba(0,0,0,0.35); }
  .ios-screen { width: 100%; height: 100%; background: #F6F5F0; border-radius: 44px; overflow: hidden; position: relative; }
  .android-frame { width: 412px; height: 915px; background: #111; border-radius: 48px; padding: 10px; box-shadow: 0 30px 60px rgba(0,0,0,0.35); }
  .android-screen { width: 100%; height: 100%; background: #F6F5F0; border-radius: 40px; overflow: hidden; position: relative; }
  .ios-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 10; }
  .ios-status { position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 20px 32px 0; display: flex; align-items: center; justify-content: space-between; font: 600 16px/1 "Archivo", sans-serif; color: #1A1A1A; z-index: 5; }
  .ios-status .g { font-size: 12px; letter-spacing: 1px; }
  .android-status { position: absolute; top: 0; left: 0; right: 0; height: 34px; padding: 14px 24px 0; display: flex; align-items: center; justify-content: space-between; font: 500 13px/1 "Archivo", sans-serif; color: #1A1A1A; z-index: 5; }
  .android-status .g { font-size: 11px; letter-spacing: 1px; }
  .ios-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; background: rgba(0,0,0,0.8); border-radius: 3px; z-index: 10; }
  .android-navbg { position: absolute; bottom: 0; left: 0; right: 0; height: 26px; background: #F6F5F0; z-index: 9; }
  .android-navig { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; z-index: 10; }
  .android-navig::after { content: ""; width: 120px; height: 4px; background: #333; border-radius: 2px; }

  .screen { height: 100%; display: flex; flex-direction: column; }
  .screen-scroll { flex: 1; overflow-y: auto; padding: 66px 26px 0; }
  .ios-screen .screen-scroll { padding-bottom: 30px; }
  .android-screen .screen-scroll { padding: 52px 24px 0; }

  /* Swiss primitives */
  .micro { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B6B; }
  .rule { border-top: 1px solid #D9D7CF; }
  .hairline { border-bottom: 1px solid #D9D7CF; }

  [data-dense="compact"] .screen-scroll { padding-top: 50px; }
  [data-dense="compact"] .streak-box { padding: 12px 0; }
  [data-dense="compact"] .streak-box .num { font-size: 44px; }
  [data-dense="compact"] .row { padding: 13px 0; }
  [data-dense="compact"] .sec-margin { margin-top: 26px; }
  [data-dense="compact"] .cta-row { margin-top: 26px; }

  .streak-box { border-top: 2px solid var(--ink, #1A1A1A); border-bottom: 1px solid var(--ink, #1A1A1A); padding: 16px 0; margin-top: 20px; display: flex; align-items: baseline; gap: 14px; }
  .streak-box .num { font-size: 52px; font-weight: 700; line-height: 0.9; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .streak-box .str { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6B6B; }
  .streak-box.all .num { color: var(--accent, #E63329); }
  .streak-box.all { border-color: var(--accent, #E63329); }
  .streak-box.all .str { color: var(--accent, #E63329); }

  .row { display: flex; align-items: center; gap: 16px; padding: 16px 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 15px; font-weight: 600; color: #1A1A1A; }
  .row .t span { display: block; font-size: 11px; letter-spacing: 0.04em; color: #8A8880; margin-top: 2px; }
  .row.off .t b { color: #9B9890; }
  .check { width: 18px; height: 18px; border: 1.5px solid var(--ink, #1A1A1A); border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease; }
  .row.done .check { background: var(--accent, #E63329); border-color: var(--accent, #E63329); }
  .row.off .check { border-color: #BBB8AE; }
  .streak-num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: #1A1A1A; flex: none; }
  .row.off .streak-num { color: #BBB8AE; }

  .sec-margin { margin-top: 34px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid #1A1A1A; padding-bottom: 8px; }
  .sec-head .n { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent, #E63329); }
  .sec-head h2 { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .sec-head .meta { margin-left: auto; font-size: 11px; letter-spacing: 0.1em; color: #6B6B6B; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .sec-head .meta .done { color: var(--accent, #E63329); }

  .cta-row { margin-top: 34px; border: 1.5px solid #1A1A1A; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; background: transparent; transition: background 0.15s ease, color 0.15s ease; width: 100%; }
  .cta-row:hover { background: #1A1A1A; color: #F6F5F0; }

  .add-form { border: 1.5px solid #1A1A1A; padding: 16px; margin-top: 18px; }
  .add-form label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B; margin: 10px 0 4px; }
  .add-form input, .add-form select { width: 100%; height: 40px; border: 1px solid #9B9890; border-radius: 0; background: #fff; font: 500 14px/1 "Archivo", sans-serif; padding: 0 10px; color: #1A1A1A; }
  .add-form input:focus-visible, .add-form select:focus-visible, .check:focus-visible, .cta-row:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent, #E63329); outline-offset: 2px; }
  .add-form .btns { display: flex; gap: 10px; margin-top: 14px; }
  .add-form .btns button { flex: 1; height: 44px; font: 600 12px/1 "Archivo", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: 1.5px solid #1A1A1A; background: transparent; }
  .add-form .btns .save { background: #1A1A1A; color: #F6F5F0; }
  .add-form .btns .save:disabled { opacity: 0.35; cursor: not-allowed; }

  .nav { position: absolute; bottom: 0; left: 0; right: 0; display: flex; border-top: 1px solid #D9D7CF; background: #F6F5F0; }
  .ios-screen .nav { padding-bottom: 40px; }
  .android-screen .nav { padding-bottom: 44px; }
  .nav button { flex: 1; height: 56px; background: none; border: none; cursor: pointer; font: 600 10px/1 "Archivo", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8A8880; border-top: 2px solid transparent; }
  .nav button.on { color: #1A1A1A; border-top-color: var(--accent, #E63329); }

  .stub { padding-top: 20px; }
  .stub p { font-size: 14px; color: #6B6B6B; line-height: 1.6; }

  /* Tweaks panel (standalone) */
  .tweaks-root { position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .tweaks-toggle { border: 1.5px solid #1A1A1A; background: #1A1A1A; color: #F6F5F0; font: 600 11px/1 "Archivo", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; padding: 14px 18px; cursor: pointer; }
  .tweaks-toggle.open { background: transparent; color: #1A1A1A; }
  .tweaks-panel { width: 240px; background: #FBF9F4; border: 1.5px solid #1A1A1A; box-shadow: 0 16px 40px rgba(0,0,0,0.18); padding: 16px; }
  .tweaks-panel h3 { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
  .t-group { margin-top: 12px; }
  .t-group .lab { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 6px; display: block; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch.on { border-color: #1A1A1A; }
  .dens { display: flex; gap: 8px; }
  .dens button { flex: 1; height: 34px; border: 1px solid #9B9890; background: transparent; font: 600 10px/1 "Archivo", sans-serif; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; color: #6B6B6B; }
  .dens button.on { border-color: #1A1A1A; background: #1A1A1A; color: #F6F5F0; }
  .ro { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ro .lab { margin: 0; }
  .onoff { width: 40px; height: 22px; border: 1px solid #9B9890; background: transparent; cursor: pointer; position: relative; }
  .onoff::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: #9B9890; transition: left 0.15s ease, background 0.15s ease; }
  .onoff.on { border-color: #1A1A1A; }
  .onoff.on::after { left: 21px; background: var(--accent, #E63329); }

  .foot { margin-top: 40px; border-top: 1px solid #CCC7BB; padding-top: 12px; font-size: 11px; line-height: 1.6; color: #8A857A; max-width: 90ch; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 820px) { .devices { gap: 30px; } .tweaks-root { right: 12px; bottom: 12px; } }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ---------- tweaks (standalone: localStorage) ---------- */
    const TWEAK_DEFAULTS = {
      accent: "#E63329",
      density: "comfortable",   // comfortable | compact
      sections: true,           // numbered section headers
      timeMeta: true            // show schedule meta under habit titles
    };
    function loadTweaks() {
      try {
        const raw = localStorage.getItem("habit-tracker-tweaks");
        return raw ? Object.assign({}, TWEAK_DEFAULTS, JSON.parse(raw)) : Object.assign({}, TWEAK_DEFAULTS);
      } catch (e) { return Object.assign({}, TWEAK_DEFAULTS); }
    }
    function saveTweaks(t) { try { localStorage.setItem("habit-tracker-tweaks", JSON.stringify(t)); } catch (e) {} }

    /* ---------- initial habits ---------- */
    const INITIAL_HABITS = [
      { id: 1, title: "Drink water", time: "06:30", repeat: "repeatedly", done: true, streak: 12 },
      { id: 2, title: "Read 20 min", time: "07:00", repeat: "daily", done: true, streak: 12 },
      { id: 3, title: "Run 5 km", time: "18:00", repeat: "mon · wed · fri", done: false, streak: 8 },
      { id: 4, title: "Meditate", time: "21:00", repeat: "daily", done: false, streak: 0 },
      { id: 5, title: "Write in journal", time: "—", repeat: "weekends", done: false, streak: 0, off: true }
    ];

    /* ---------- tiny icons (SVG, no emoji) ---------- */
    const Check = ({ size }) => (
      <svg width={size || 11} height={size || 11} viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M2 6.2l2.6 2.6L10 3.4" stroke="#F6F5F0" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
    const Plus = ({ size }) => (
      <svg width={size || 14} height={size || 14} viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 1.5v11M1.5 7h11" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
      </svg>
    );

    /* ---------- device frames ---------- */
    const PhoneFrame = ({ platform, children, tweaks }) => {
      if (platform === "ios") {
        return (
          <div className="frame-wrap ios-wrap">
            <div className="frame-scaled ios-scaled">
              <div className="ios-frame">
                <div className="ios-screen">
                  <div className="ios-island"></div>
                  <div className="ios-status">
                    <span>9:41</span>
                    <span className="g">●●●</span>
                  </div>
                  <div className="screen" data-dense={tweaks.density} style={{ ["--accent"]: tweaks.accent, ["--ink"]: "#1A1A1A" }}>
                    {children}
                  </div>
                  <div className="ios-home"></div>
                </div>
              </div>
            </div>
          </div>
        );
      }
      return (
        <div className="frame-wrap android-wrap">
          <div className="frame-scaled android-scaled">
            <div className="android-frame">
              <div className="android-screen">
                <div className="android-status">
                  <span>9:41</span>
                  <span className="g">▬▬▬ ◉</span>
                </div>
                <div className="screen" data-dense={tweaks.density} style={{ ["--accent"]: tweaks.accent, ["--ink"]: "#1A1A1A" }}>
                  {children}
                </div>
                <div className="android-navbg"></div>
                <div className="android-navig"></div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    /* ---------- NavBar (bottom nav) ---------- */
    const NavBar = ({ active, onPick }) => {
      const tabs = ["Today", "Habits", "Insights", "Profile"];
      return (
        <nav className="nav" role="tablist" aria-label="Bottom navigation">
          {tabs.map((t) => (
            <button key={t} role="tab" aria-selected={active === t} className={active === t ? "on" : ""} onClick={() => onPick(t)}>
              {t}
            </button>
          ))}
        </nav>
      );
    };

    /* ---------- Section header (numbered, Swiss) ---------- */
    const SectionHead = ({ n, title, meta, tweaks }) => {
      if (!tweaks.sections) {
        return <div className="sec-head"><h2>{title}</h2>{meta ? <span className="meta">{meta}</span> : null}</div>;
      }
      return (
        <div className="sec-head">
          <span className="n">{n}</span>
          <h2>{title}</h2>
          {meta ? <span className="meta">{meta}</span> : null}
        </div>
      );
    };

    /* ---------- Today view ---------- */
    const TodayView = ({ habits, toggle, addOpen, setAddOpen, onSave, form, setForm, tweaks, onNav }) => {
      const pad = (n) => String(n).padStart(2, "0");
      const due = habits.filter((h) => !h.off);
      const doneCount = due.filter((h) => h.done).length;
      const total = due.length;
      const allDone = total > 0 && doneCount === total;
      const streak = allDone ? 13 : 12;

      const metaNode = <span><span className="done">{pad(doneCount)}</span> / {pad(total)} done</span>;

      return (
        <>
          <div className="screen-scroll">
            <header>
              <div className="micro" style={{ letterSpacing: "0.08em" }}>Tue · 22 Sep</div>
              <h1 style={{ fontSize: 30, fontWeight: 700, letterSpacing: "-0.01em", marginTop: 8 }}>
                Good morning,<br />Alex.
              </h1>
              <p style={{ marginTop: 10, fontSize: 13, color: "#6B6B6B", lineHeight: 1.55, maxWidth: "32ch" }}>
                Two small actions keep the run alive. Finish all three to extend it.
              </p>
            </header>

            <div className={"streak-box" + (allDone ? " all" : "")}>
              <div className="num">{streak}</div>
              <div className="str">{allDone ? "Streak extended — run alive ✓" : "Day streak · running"}</div>
            </div>

            <section className="sec-margin">
              <SectionHead n="01" title="Today" meta={metaNode} tweaks={tweaks} />
              <div style={{ marginTop: 4 }}>
                {due.map((h) => (
                  <div key={h.id} className={(h.done ? "row done" : "row") + (h.off ? " off" : "")}>
                    <button className="check" onClick={() => toggle(h.id)} aria-label={h.done ? "Mark " + h.title + " as not done" : "Mark " + h.title + " as done"} style={{ ["--ink"]: tweaks.sections ? "#1A1A1A" : "#1A1A1A" }}>
                      {h.done ? <Check /> : null}
                    </button>
                    <div className="t">
                      <b>{h.title}</b>
                      {tweaks.timeMeta ? <span>{h.time} · {h.repeat}</span> : null}
                    </div>
                    {h.streak > 0 ? <span className="streak-num">{h.streak}</span> : null}
                  </div>
                ))}
              </div>
            </section>

            <section className="sec-margin">
              <SectionHead n="02" title="Up next" tweaks={tweaks} />
              <div style={{ marginTop: 4 }}>
                <div className="hairline" style={{ padding: "16px 0", display: "flex", justifyContent: "space-between" }}>
                  <div className="t"><b style={{ fontSize: 15, fontWeight: 600, color: "#1A1A1A" }}>Sunday reset</b><span style={{ fontSize: 11, color: "#8A8880", marginTop: 2, display: "block" }}>weekly review · Sunday</span></div>
                  <span className="micro" style={{ alignSelf: "center" }}>Sun</span>
                </div>
              </div>
            </section>

            {addOpen ? (
              <form className="add-form" onSubmit={onSave}>
                <h3 className="micro" style={{ marginBottom: 2 }}>New habit</h3>
                <label htmlFor="nh-name">Name</label>
                <input id="nh-name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="e.g. Stretch 10 min" autoFocus />
                <label htmlFor="nh-time">Time</label>
                <input id="nh-time" value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} placeholder="e.g. 20:00" />
                <label htmlFor="nh-rep">Repeat</label>
                <select id="nh-rep" value={form.repeat} onChange={(e) => setForm({ ...form, repeat: e.target.value })}>
                  <option>daily</option>
                  <option>mon · wed · fri</option>
                  <option>weekends</option>
                  <option>repeatedly</option>
                </select>
                <div className="btns">
                  <button type="button" onClick={() => setAddOpen(false)}>Cancel</button>
                  <button className="save" type="submit" disabled={!form.name.trim()}>Save</button>
                </div>
              </form>
            ) : (
              <button className="cta-row" onClick={() => setAddOpen(true)}>
                <Plus size={14} /> Add habit
              </button>
            )}
          </div>
          <NavBar active="Today" onPick={onNav} />
        </>
      );
    };

    /* ---------- Habits view (light, reuses data) ---------- */
    const HabitsView = ({ habits, toggle, tweaks, onNav }) => (
      <>
        <div className="screen-scroll">
          <header>
            <div className="micro" style={{ letterSpacing: "0.08em" }}>Library</div>
            <h1 style={{ fontSize: 30, fontWeight: 700, marginTop: 8 }}>Habits.</h1>
          </header>
          {habits.map((h) => (
            <div key={h.id} className={h.done ? "row done" : "row"} style={{ borderBottom: "1px solid #D9D7CF" }}>
              <button className="check" onClick={() => toggle(h.id)} aria-label={h.done ? "Mark " + h.title + " as not done" : "Mark " + h.title + " as done"}>
                {h.done ? <Check /> : null}
              </button>
              <div className="t">
                <b>{h.title}</b>
                <span>{h.repeat}</span>
              </div>
              {h.streak > 0 ? <span className="streak-num">{h.streak}</span> : null}
            </div>
          ))}
        </div>
        <NavBar active="Habits" onPick={onNav} />
      </>
    );

    /* ---------- stub for out-of-scope tabs ---------- */
    const StubView = ({ title, onNav }) => (
      <>
        <div className="screen-scroll">
          <header>
            <div className="micro">Module</div>
            <h1 style={{ fontSize: 30, fontWeight: 700, marginTop: 8 }}>{title}.</h1>
          </header>
          <div className="stub">
            <p>Not part of this prototype — only the <b>Today</b> main screen was briefed.
            Switch back to Today to continue exploring the main screen.</p>
          </div>
        </div>
        <NavBar active={title} onPick={onNav} />
      </>
    );

    /* ---------- Tweaks panel (standalone) ---------- */
    const TweaksPanel = ({ tweaks, onChange, open }) => {
      const swatches = [
        ["Signal red", "#E63329"],
        ["Prussian blue", "#1D4ED8"],
        ["Sulphur", "#D9A200"]
      ];
      return (
        <>
          <button className={"tweaks-toggle" + (open ? " open" : "")} onClick={() => onChange("_open", !open)} aria-expanded={open}>
            {open ? "Close tweaks" : "Tweaks"}
          </button>
          {open ? (
            <div className="tweaks-panel">
              <h3>Tweaks</h3>
              <div className="t-group">
                <span className="lab">Accent (signal colour)</span>
                <div className="swatches">
                  {swatches.map(([name, c]) => (
                    <button key={c} className={"swatch" + (tweaks.accent === c ? " on" : "")} style={{ background: c }} onClick={() => onChange("accent", c)} aria-label={"Accent " + name} title={name}></button>
                  ))}
                </div>
              </div>
              <div className="t-group">
                <span className="lab">Density</span>
                <div className="dens">
                  <button className={tweaks.density === "comfortable" ? "on" : ""} onClick={() => onChange("density", "comfortable")}>Comfortable</button>
                  <button className={tweaks.density === "compact" ? "on" : ""} onClick={() => onChange("density", "compact")}>Compact</button>
                </div>
              </div>
              <div className="t-group ro">
                <span className="lab">Numbered sections</span>
                <button className={"onoff" + (tweaks.sections ? " on" : "")} onClick={() => onChange("sections", !tweaks.sections)} aria-label="Toggle numbered sections" aria-pressed={tweaks.sections}></button>
              </div>
              <div className="t-group ro">
                <span className="lab">Show time meta</span>
                <button className={"onoff" + (tweaks.timeMeta ? " on" : "")} onClick={() => onChange("timeMeta", !tweaks.timeMeta)} aria-label="Toggle time meta" aria-pressed={tweaks.timeMeta}></button>
              </div>
            </div>
          ) : null}
        </>
      );
    };

    /* ---------- App ---------- */
    const App = () => {
      const [habits, setHabits] = useState(INITIAL_HABITS);
      const [tab, setTab] = useState("Today");
      const [addOpen, setAddOpen] = useState(false);
      const [form, setForm] = useState({ name: "", time: "", repeat: "daily" });
      const [tweaks, setTweaks] = useState(loadTweaks);
      const [tweaksOpen, setTweaksOpen] = useState(false);

      useEffect(() => { saveTweaks(tweaks); }, [tweaks]);

      const toggle = (id) => setHabits((hs) => hs.map((h) => (h.id === id ? { ...h, done: !h.done } : h)));

      const onSave = (e) => {
        e.preventDefault();
        if (!form.name.trim()) return;
        const nextId = Math.max(0, ...habits.map((h) => h.id)) + 1;
        setHabits([...habits, { id: nextId, title: form.name.trim(), time: form.time || "—", repeat: form.repeat, done: false, streak: 0 }]);
        setForm({ name: "", time: "", repeat: "daily" });
        setAddOpen(false);
      };

      const changeTweak = (key, value) => {
        if (key === "_open") { setTweaksOpen(value); return; }
        setTweaks((t) => ({ ...t, [key]: value }));
      };

      return (
        <div className="page">
          <header className="toolbar">
            <h1>Habit Tracker — Main Screen</h1>
            <span className="sys">Swiss Editorial · Archivo · ink #1A1A1A / paper #F6F5F0 · accent signal</span>
            <p className="note">
              Hi-fi interactive prototype. <b>Try:</b> tap habit checks, finish all three to extend the streak,
              add a habit, switch bottom tabs, and open <code>Tweaks</code> (accent colour · density · section numbers).
              iOS and Android render the same state side by side.
            </p>
          </header>

          <div className="devices">
            <div className="device-col">
              <span className="device-label">iOS · iPhone 15</span>
              <PhoneFrame platform="ios" tweaks={tweaks}>
                {tab === "Today" ? <TodayView habits={habits} toggle={toggle} addOpen={addOpen} setAddOpen={setAddOpen} onSave={onSave} form={form} setForm={setForm} tweaks={tweaks} onNav={setTab} /> : null}
                {tab === "Habits" ? <HabitsView habits={habits} toggle={toggle} tweaks={tweaks} onNav={setTab} /> : null}
                {tab === "Insights" ? <StubView title="Insights" onNav={setTab} /> : null}
                {tab === "Profile" ? <StubView title="Profile" onNav={setTab} /> : null}
              </PhoneFrame>
            </div>

            <div className="device-col">
              <span className="device-label">Android · Pixel</span>
              <PhoneFrame platform="android" tweaks={tweaks}>
                {tab === "Today" ? <TodayView habits={habits} toggle={toggle} addOpen={addOpen} setAddOpen={setAddOpen} onSave={onSave} form={form} setForm={setForm} tweaks={tweaks} onNav={setTab} /> : null}
                {tab === "Habits" ? <HabitsView habits={habits} toggle={toggle} tweaks={tweaks} onNav={setTab} /> : null}
                {tab === "Insights" ? <StubView title="Insights" onNav={setTab} /> : null}
                {tab === "Profile" ? <StubView title="Profile" onNav={setTab} /> : null}
              </PhoneFrame>
            </div>
          </div>

          <p className="foot">
            Design notes — the nav bar, tweaks, add-form and habit state are wired with real state (React 18, pinned).
            Only the <b>Today</b> screen is designed per the brief; Habits reuses the data; Insights/Profile are stubs.
            Variations are exposed as Tweaks, not duplicate files.
          </p>

          <div className="tweaks-root">
            <TweaksPanel tweaks={tweaks} onChange={changeTweak} open={tweaksOpen} />
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
