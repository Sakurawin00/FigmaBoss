<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakurawin00 — учусь веб-разработке</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f4;
      color: #292524;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    h1 { font-size: 28px; font-weight: 700; }
    p { margin-top: 14px; line-height: 1.7; color: #44403c; }
    code {
      background: #f5f5f4;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sakurawin00</h1>
    <p>
      Привет! Я учусь веб-разработке: осваиваю <code>HTML</code>,
      <code>CSS</code> и <code>JavaScript</code>, а потихоньку добираюсь
      и до инструментов — от <code>git</code> до сборщиков.
    </p>
    <p>
      Это моя первая страничка в новом git-репозитории. Дальше — больше:
      разметка, стили, интерактив и настоящие проекты.
    </p>
  </main>
</body>
</html>
